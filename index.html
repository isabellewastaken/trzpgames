		        :root {

        --steam-card-bg: #2d243d;
        }
	body::before {
    	content: "";
    	position: fixed;
    	inset: 0;
		background: url("background.jpg") center / cover no-repeat;
    	opacity: 0.4;
    	z-index: -1;
    }
	body {
        background-color: #4b4473;
	    margin: 0;
    	color: var(--text-light);
    	display: flex;
    	height: 100vh;
	}
		      .sidebar {
        width: 200px;
        background-color: var(--steam-black);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
      }

    .sidebar-header {
        padding: 20px 20px 10px 20px;
        font-size: 0.8em;
        font-weight: bold;
        color: var(--steam-blue);
        letter-spacing: 1px;
    }

    .main-view {
        flex: 1;
        display: flex;
        position: relative;
        flex-direction: column;
    }

    .grid-container {
        display: grid;
        gap: 15px;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        padding: 15px;
        overflow-y: auto;
      }

      .game-card {
        background-color: var(--steam-card-bg);
        border-radius: 4px;
        position: relative;
	      cursor: pointer;
      }

      .game-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
	</style>
